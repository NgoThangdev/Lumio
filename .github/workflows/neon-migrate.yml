name: Apply Neon migrations

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Type MIGRATE to confirm the production migration
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neon-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Verify migration authorization
        env:
          SELECTED_REF: ${{ github.ref }}
          CONFIRMATION: ${{ inputs.confirm_production }}
        run: |
          if [ "$SELECTED_REF" != "refs/heads/main" ]; then
            echo "::error::Production migrations can only run from main."
            exit 1
          fi
          if [ "$CONFIRMATION" != "MIGRATE" ]; then
            echo "::error::Enter MIGRATE to confirm the production migration."
            exit 1
          fi

      - name: Check out selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy and verify migrations
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret NEON_DATABASE_URL_DIRECT is missing or empty."
            exit 1
          fi
          ../../node_modules/.bin/prisma migrate deploy
          ../../node_modules/.bin/prisma migrate status
