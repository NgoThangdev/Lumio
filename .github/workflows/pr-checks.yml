name: PR checks

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/lumio_ci
        run: npx prisma generate

      - name: Check API
        run: |
          npm run lint -w @lumio/api
          npm run test -w @lumio/api
          npm run build -w @lumio/api

      - name: Check web
        run: |
          npm run lint -w @lumio/web
          npm run i18n:check -w @lumio/web
          npm run build -w @lumio/web
